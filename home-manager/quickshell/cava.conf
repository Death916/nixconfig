# Spectrum source for Quickshell Omadeck media card
# cava reads the Pipewire output monitor, computes FFT, and prints raw ASCII bar values
[general]
mode = normal
framerate = 60
bars = 32
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 12000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
